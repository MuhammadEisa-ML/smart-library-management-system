<article class="book-card"><div class="cover">{{ book.title[0] }}</div><div><span class="tag">{{ book.category }}</span><h3><a href="{{ url_for('book_detail', book_id=book.id) }}">{{ book.title }}</a></h3><p>{{ book.author }}</p><small class="{{ 'available' if book.available else 'unavailable' }}">{{ book.available }} of {{ book.quantity }} available</small></div></article>
