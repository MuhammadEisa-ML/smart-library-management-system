{% extends 'base.html' %}{% block content %}<section class="auth wide"><p class="eyebrow">Librarian tools</p><h1>{{ 'Edit book' if book else 'Add a new book' }}</h1><form method="post" class="form-grid"><label>Title<input name="title" value="{{ book.title if book else '' }}" required></label><label>Author<input name="author" value="{{ book.author if book else '' }}" required></label><label>ISBN<input name="isbn" value="{{ book.isbn if book and book.isbn else '' }}"></label><label>Category<input name="category" value="{{ book.category if book else '' }}" required></label><label>Publisher<input name="publisher" value="{{ book.publisher if book and book.publisher else '' }}"></label><label>Publication year<input name="publication_year" type="number" min="0" value="{{ book.publication_year if book and book.publication_year else '' }}"></label><label>Quantity<input name="quantity" type="number" min="0" value="{{ book.quantity if book else '' }}" required></label><label>Shelf location<input name="shelf_location" value="{{ book.shelf_location if book and book.shelf_location else '' }}"></label><label class="full">Description<textarea name="description">{{ book.description if book and book.description else '' }}</textarea></label><div class="full"><button>{{ 'Save changes' if book else 'Add book' }}</button> <a class="button secondary" href="{{ url_for('books') }}">Cancel</a></div></form></section>{% endblock %}
